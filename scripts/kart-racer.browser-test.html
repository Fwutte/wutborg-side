<!doctype html><html lang="da"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kart browser QA</title>
<style>body{margin:0;background:#142b33;color:#eaffd0;font:12px monospace}iframe{position:fixed;inset:0;border:0;width:100%;height:100%}#report{position:fixed;left:10px;bottom:35px;z-index:100;max-width:92%;background:#122833ed;color:#eaffb7;padding:12px;white-space:pre-wrap;max-height:25vh;overflow:auto;border:1px solid #bdd691}button{font:inherit;padding:8px}</style>
<iframe id="game" title="Wutborg Kart QA" src="../kart-racer.html"></iframe><output id="report">Initialiserer QA…</output>
<script>
const frame=document.getElementById('game'),out=document.getElementById('report'),checks=[];
const params=new URLSearchParams(location.search),scenario=params.get('scenario')||'integration';
const fail=message=>{throw Error(message);};
function check(condition,message){if(!condition)fail(message);checks.push('OK '+message);out.textContent=checks.join('\n');}
async function ready(){
 const w=frame.contentWindow,g=w.wutborgKartGame;if(!g){setTimeout(ready,100);return;}
 const D=w.WutborgKartData,doc=w.document;
 w.WutborgHighscores={submit:async()=>({ok:true})};g.persist=()=>{};g.audio.enabled=false;
 const errors=[];w.addEventListener('error',e=>errors.push(e.message));
 const consoleError=w.console.error.bind(w.console);w.console.error=(...args)=>{errors.push(args.map(String).join(' '));consoleError(...args);};
 try{
  if(scenario==='preview'){
   if(D.DIFFICULTIES[params.get('difficulty')])g.difficulty=params.get('difficulty');
   g.selectedTrackId=D.TRACKS[Number(params.get('track')||0)].id;g.mode='single';g.autoGas=true;g.startRace();
   if(params.has('at')){
    const s=Number(params.get('at'))*g.track.length;
    g.race.karts.forEach((k,i)=>{const p=g.track.at(s-i*70,(i%3-1)*28);Object.assign(k,{x:p.x,y:p.y,elevation:p.elevation,slope:p.slope,heading:p.heading,velocityHeading:p.heading,lastX:p.x,lastY:p.y,lastS:p.s,raceDistance:s-i*70,progress:s-i*70,nextGate:(Math.floor((s-i*70)/(g.track.length/12))+1)*g.track.length/12,gateCount:Math.floor((s-i*70)/(g.track.length/12)),road:g.track.nearest(p.x,p.y),speed:280});});
    g.race.state='racing';
   }
   const original=g.input.read.bind(g.input);g.input.read=()=>g.race.ai.inputFor(g.race.player,g.track,g.race);
   let frames=0,firstFrame=0,lastFrame=0,warmup=0;const originalDraw=g.renderer.draw.bind(g.renderer);
   g.renderer.draw=(r,dt,o)=>{originalDraw(r,dt,o);if(warmup++>30&&!o.paused){lastFrame=w.performance.now();if(!firstFrame)firstFrame=lastFrame;frames++;}};
   const timer=setInterval(()=>{
    out.textContent=JSON.stringify({track:g.track.name,state:g.race.state,seconds:+g.race.elapsed.toFixed(1),lap:g.race.player.lap,rank:g.race.player.rank,renderFPS:Math.round((frames-1)*1000/Math.max(lastFrame-firstFrame,1)),drawCalls:g.renderer.renderer?.info.render.calls,triangles:g.renderer.renderer?.info.render.triangles,errors},null,2);
    if(g.race.elapsed>Number(params.get('stop')||10)&&!g.paused){g.togglePause(true);doc.getElementById('kart-pause').hidden=true;doc.body.classList.remove('kart-paused');clearInterval(timer);}
   },250);return;
  }
  check(g.renderer.constructor.name==='KartRacer3DRenderer','WebGL renderer initialized');
  g.autoGas=false;g.mode='single';g.startRace();g.audio.enabled=false;
  check(g.race.player.rank===8,'player starts eighth');
  const control=doc.querySelector('[data-kart-control="left"]');
  g.input.setControl('left',true,11);g.input.setControl('drift',true,12);
  const v=g.input.read();check(v.steer===-1&&v.drift,'simultaneous mobile inputs');g.input.reset();
  g.togglePause(true);const before=g.race.countdown;g.update(.5);check(g.race.countdown===before,'pause freezes countdown');
  check(!g.input.enabled&&doc.getElementById('kart-pause').hidden===false,'pause state and dialog');
  g.togglePause(false);check(g.input.enabled&&doc.activeElement===g.canvas,'resume restores driving focus');
  g.race.countdown=0;g.race.state='racing';
  const event=new w.KeyboardEvent('keydown',{code:'KeyW',bubbles:true});g.canvas.dispatchEvent(event);g.update(1/60);
  check(g.race.player.speed>0,'keyboard accelerates');g.canvas.dispatchEvent(new w.KeyboardEvent('keyup',{code:'KeyW',bubbles:true}));g.input.reset();
  g.race.player.item='mushroom';doc.getElementById('kart-item').click();g.update(1/60);check(g.race.player.boostTimer>0&&doc.activeElement===g.canvas,'HUD item button uses turbo and restores driving focus');
  w.dispatchEvent(new w.Event('blur'));check(g.paused&&!g.input.enabled,'window blur pauses');g.togglePause(false);
  if(scenario==='refinement'||scenario==='ghost-view'){
   const unlock=g.audio.unlock;g.audio.unlock=()=>{};
   doc.getElementById('kart-sound').focus();doc.getElementById('kart-sound').click();
   check(doc.activeElement===g.canvas,'sound toggle restores driving focus');g.audio.enabled=false;g.audio.unlock=unlock;
   const fullscreen=doc.documentElement.requestFullscreen;doc.documentElement.requestFullscreen=async()=>{throw Error('QA fullscreen rejection');};
   doc.getElementById('kart-fullscreen').focus();doc.getElementById('kart-fullscreen').click();await new Promise(resolve=>w.requestAnimationFrame(resolve));
   check(doc.activeElement===g.canvas,'fullscreen rejection restores driving focus');doc.documentElement.requestFullscreen=fullscreen;
   g.canvas.dispatchEvent(new w.KeyboardEvent('keydown',{code:'Escape',bubbles:true}));check(g.paused,'escape pauses');
   g.canvas.dispatchEvent(new w.KeyboardEvent('keydown',{code:'Escape',repeat:true,bubbles:true}));check(g.paused,'held escape does not repeatedly toggle');g.togglePause(false);
   const recover=doc.querySelector('[data-kart-control="recover"]'),beforeRecovery=g.race.player.recoveries;
   recover.classList.add('pressed');g.input.setControl('recover',true,77);g.handleCommands();g.handleCommands();
   check(g.race.player.recoveries===beforeRecovery+1,'touch recovery fires once');g.togglePause(true);
   check(!recover.classList.contains('pressed')&&!g.input.readCommands().recover,'pause clears touch highlights and pending recovery');g.togglePause(false);
   const originalPads=w.navigator.getGamepads.bind(w.navigator),pad={id:'QA',index:0,connected:true,axes:[0],buttons:Array.from({length:16},()=>({pressed:false,value:0}))};
   Object.defineProperty(w.navigator,'getGamepads',{configurable:true,value:()=>[pad]});g.handleCommands();
   pad.buttons[9].pressed=true;g.handleCommands();check(g.paused,'gamepad Start pauses');g.handleCommands();check(g.paused,'held Start does not resume');
   pad.buttons[9].pressed=false;g.handleCommands();pad.buttons[9].pressed=true;g.handleCommands();check(!g.paused&&doc.activeElement===g.canvas,'gamepad Start resumes');
   pad.buttons[9].pressed=false;g.handleCommands();const recovered=g.race.player.recoveries;
   pad.buttons[1].pressed=true;g.handleCommands();g.handleCommands();check(g.race.player.recoveries===recovered+1,'gamepad B recovers once');
   pad.buttons[1].pressed=false;g.handleCommands();g.showMenu();pad.buttons[9].pressed=true;g.handleCommands();check(g.race.state==='countdown','gamepad Start launches selected race');
   pad.buttons[9].pressed=false;g.handleCommands();Object.defineProperty(w.navigator,'getGamepads',{configurable:true,value:originalPads});
   g.mode='time';g.save.ghosts={};g.startRace();g.audio.enabled=false;g.race.state='racing';
   let ticks=0;while(g.race.state==='racing'&&ticks++<60*180)g.race.update(1/60,g.race.ai.inputFor(g.race.player,g.track,g.race));
   check(g.race.state==='finished'&&g.race.player.recoveries===0,'clean time trial finishes with real physics');g.showResult();
   const saved=g.save.ghosts[g.ghostKey()];check(w.WutborgKart.testHooks.RaceGhost.valid(saved)&&saved.frames.length>200,'best clean run creates bounded ghost recording');
   Object.defineProperty(w.navigator,'getGamepads',{configurable:true,value:()=>[pad]});g.handleCommands();pad.buttons[9].pressed=true;g.handleCommands();
   check(g.race.state==='countdown','gamepad Start retries from result');g.handleCommands();check(g.race.state==='countdown'&&!g.paused,'held Start does not pause the new race');
   pad.buttons[9].pressed=false;g.handleCommands();Object.defineProperty(w.navigator,'getGamepads',{configurable:true,value:originalPads});g.audio.enabled=false;
   check(g.race.karts.length===1&&g.race.ghost.saved===saved,'retry loads ghost without adding a physical opponent');
   g.renderer.draw(g.race,1/60,{alpha:1});const memory={...g.renderer.renderer.info.memory};g.startRace();g.audio.enabled=false;g.renderer.draw(g.race,1/60,{alpha:1});
   check(g.renderer.renderer.info.memory.geometries<=memory.geometries+3&&g.renderer.renderer.info.memory.textures<=memory.textures+3,'rebuilding ghost scenes releases GPU resources');
   g.race.state='racing';g.race.elapsed=8;const pose=g.race.ghost.pose(8),human=g.track.at(pose.progress-120,35),p=g.race.player;
   Object.assign(p,{x:human.x,y:human.y,heading:human.heading,velocityHeading:human.heading,elevation:human.elevation,road:g.track.nearest(human.x,human.y),progress:pose.progress-120,speed:300,previousPose:null,gear:3,rpm:5000});
   g.renderer.cameraReady=false;
   g.updateUI(w.performance.now());g.renderer.draw(g.race,1/60,{alpha:1});
   check(g.renderer.ghostMesh?.visible&&g.renderer.ghostMesh.children.every(m=>!m.castShadow&&m.material.transparent&&!m.material.depthWrite),'translucent ghost renders without shadows');
   check(!doc.getElementById('ghost-status').hidden&&doc.getElementById('ghost-delta').textContent.includes('bagud'),'ghost HUD compares time at the same track progress');
   check(doc.getElementById('kart-item').hidden&&doc.querySelector('[data-kart-control="item"]').hidden,'time trial hides unusable item controls');
   const before=JSON.stringify({x:p.x,y:p.y,coins:p.coins,progress:p.progress});g.renderer.draw(g.race,1/60,{alpha:.5});
   check(JSON.stringify({x:p.x,y:p.y,coins:p.coins,progress:p.progress})===before,'ghost rendering cannot affect player physics or pickups');
   g.renderer.draw(g.race,1/60,{alpha:1});g.togglePause(true);const clock=g.race.elapsed,ghostX=g.renderer.ghostMesh.position.x;g.update(10);g.renderer.draw(g.race,1/60,{alpha:1,paused:true});
   check(g.race.elapsed===clock&&Math.abs(g.renderer.ghostMesh.position.x-ghostX)<.000001,'pause freezes clock and ghost');
   g.race.elapsed=saved.time+1;g.renderer.draw(g.race,1/60,{alpha:1,paused:true});check(!g.renderer.ghostMesh.visible,'ghost disappears after its finish');
   g.race.elapsed=clock;g.renderer.draw(g.race,1/60,{alpha:1,paused:true});g.updateUI(w.performance.now());
   check(errors.length===0,'no refinement runtime errors');out.textContent='PASS · '+checks.length+' refinement integration checks\n'+checks.join('\n');out.dataset.status='passed';
   if(scenario==='ghost-view'){doc.getElementById('kart-pause').hidden=true;doc.body.classList.remove('kart-paused');doc.getElementById('kart-pause-button').textContent='Pause';out.hidden=true;}
   return;
  }
  if(scenario==='racing'||scenario==='racing-view'){
   const p=g.race.player,renderer=g.renderer,point=g.track.at(650);
   Object.assign(p,{x:point.x,y:point.y,elevation:point.elevation,heading:point.heading,velocityHeading:point.heading,road:g.track.nearest(point.x,point.y),speed:300,previousPose:null,slipstream:1,gear:3,rpm:5000,lap:1,lapTimes:[30],lapStarted:30});
   for(const [i,k] of g.race.karts.entries())if(i){
    const forward=i===1?20:100+i*25,lateral=i===1?-55:0;
    Object.assign(k,{x:p.x+Math.cos(p.heading)*forward-Math.sin(p.heading)*lateral,y:p.y+Math.sin(p.heading)*forward+Math.cos(p.heading)*lateral,elevation:p.elevation,heading:p.heading,velocityHeading:p.heading,speed:300,progress:p.progress+forward,airHeight:0});
   }
   g.race.elapsed=35;g.race.options.bestLap=32;g.race.lapFeedback={lap:1,time:30,delta:-2,isBest:true,at:35};g.race.updateRankings();g.updateUI(w.performance.now());
   check(doc.getElementById('kart-gear').textContent==='3'&&doc.getElementById('rpm-fill').style.width!=='0%','gear and RPM feedback shown');
   check(doc.getElementById('kart-best-lap').textContent==='0:30.00','best lap shown');
   check(!doc.getElementById('lap-feedback').hidden&&doc.getElementById('lap-feedback-delta').textContent.includes('2.00'),'completed lap and delta shown');
   check(!doc.getElementById('draft-meter').hidden&&doc.getElementById('draft-fill').style.width==='100%','slipstream charge shown');
   check(!doc.getElementById('proximity-left').hidden&&!doc.getElementById('proximity-radar').hidden,'radar warns about alongside rival');
   check(doc.getElementById('rival-distance').textContent.includes('s foran'),'estimated gap to next rival shown');
   g.canvas.dispatchEvent(new w.KeyboardEvent('keydown',{code:'KeyC',bubbles:true}));check(g.input.read().lookBack,'keyboard rear view held');
   g.canvas.dispatchEvent(new w.KeyboardEvent('keyup',{code:'KeyC',bubbles:true}));check(!g.input.read().lookBack,'keyboard rear view released');
   g.input.setControl('lookBack',true,9);check(g.input.read().lookBack,'touch rear view held');g.input.reset();
   renderer.draw(g.race,1/60,{alpha:1,lookBack:true});
   let dx=renderer.camera.position.x-(p.x-2200)*.032,dz=renderer.camera.position.z-(p.y-2100)*.032;
   check(dx*Math.cos(p.heading)+dz*Math.sin(p.heading)>0,'rear camera looks back from ahead of the car');
   renderer.draw(g.race,1/60,{alpha:1,lookBack:false});
   dx=renderer.camera.position.x-(p.x-2200)*.032;dz=renderer.camera.position.z-(p.y-2100)*.032;
   check(dx*Math.cos(p.heading)+dz*Math.sin(p.heading)<0,'releasing rear view restores chase camera immediately');
   check(renderer.coinMeshes.length===2&&renderer.coinMeshes.every(m=>m.isInstancedMesh),'all coins share two instanced meshes');
   g.race.coins[0].cooldown=2;renderer.draw(g.race,1/60,{alpha:1});
   const hidden=renderer.coinMeshes[0].instanceMatrix.array;
   check([0,1,2,4,5,6,8,9,10].every(i=>hidden[i]===0),'collected coin instances hide');
   g.race.coins[0].cooldown=0;renderer.draw(g.race,1/60,{alpha:1});
   check(renderer.coinMeshes[0].instanceMatrix.array[5]===1,'coin instances reappear after cooldown');
   g.audio.enabled=true;g.audio.unlock();
   if(g.audio.context){g.audio.master.gain.value=0;g.audio.update(p,true);check(g.audio.tyres.loop&&g.audio.tyres.buffer.length>0,'engine and tyre audio graph initialized');g.audio.update(p,false);g.audio.context.suspend();}g.audio.enabled=false;
   const label=doc.getElementById('lap-feedback-title').textContent;
   g.togglePause(true);g.update(6);g.updateUI(w.performance.now());check(doc.getElementById('lap-feedback-title').textContent===label&&!doc.getElementById('lap-feedback').hidden,'pause freezes lap feedback lifetime');
   g.mode='time';g.updateUI(w.performance.now());check(doc.getElementById('rival-gap').hidden&&doc.getElementById('proximity-radar').hidden,'time trial hides rival HUD');g.mode='single';g.updateUI(w.performance.now());
   check(errors.length===0,'no racing feedback runtime errors');
   out.textContent='PASS · '+checks.length+' racing integration checks\n'+checks.join('\n');out.dataset.status='passed';
   if(scenario==='racing-view'){doc.getElementById('kart-pause').hidden=true;doc.body.classList.remove('kart-paused');doc.getElementById('kart-pause-button').textContent='Pause';out.hidden=true;}
   return;
  }
  if(scenario==='handling'){
   g.race.player.speed=240;
   for(const code of ['KeyW','KeyD'])g.canvas.dispatchEvent(new w.KeyboardEvent('keydown',{code,bubbles:true}));
   for(let i=0;i<24;i++)g.update(1/60);
   g.input.reset();const p=g.race.player,renderer=g.renderer;
   renderer.draw(g.race,1/60,{alpha:0});const mesh=renderer.karts[0];
   check(Math.abs(mesh.group.position.x-(p.previousPose.x-2200)*.032)<.00001,'interpolation renders previous physics pose at alpha zero');
   renderer.draw(g.race,1/60,{alpha:1});
   check(Math.abs(mesh.group.position.x-(p.x-2200)*.032)<.00001,'interpolation renders current physics pose at alpha one');
   check(mesh.body.rotation.z!==0&&Number.isFinite(mesh.body.rotation.x),'body roll and pitch follow acceleration');
   check(mesh.wheels.filter(wheel=>wheel.front).every(wheel=>Math.abs(wheel.pivot.rotation.y+p.steeringAngle)<.00001),'front wheels reflect speed-sensitive steering');
   const wheelRotation=mesh.wheels[0].wheel.rotation.x;g.togglePause(true);
   renderer.draw(g.race,.1,{paused:true,alpha:1});
   check(mesh.wheels[0].wheel.rotation.x===wheelRotation,'wheel animation freezes with simulation');
   p.recover(g.track);renderer.draw(g.race,1/60,{alpha:1});
   check(renderer.cameraRecoveries===p.recoveries&&p.previousPose===null,'recovery resets camera and interpolation');
   g.showMenu();renderer.draw(g.race,.016,{driver:D.DRIVERS[0]});const memory={...renderer.renderer.info.memory};
   g.showMenu();renderer.draw(g.race,.016,{driver:D.DRIVERS[0]});
   check(renderer.renderer.info.memory.geometries<=memory.geometries+3&&renderer.renderer.info.memory.textures<=memory.textures+3,'handling scene cleanup releases GPU resources');
   check(errors.length===0,'no handling runtime errors');
   out.textContent='PASS · '+checks.length+' handling integration checks\n'+checks.join('\n');out.dataset.status='passed';return;
  }
  g.mode='cup';g.cup={round:0,points:Object.fromEntries(D.DRIVERS.map(d=>[d.id,0]))};g.startRace();g.audio.enabled=false;
  for(let round=0;round<D.TRACKS.length;round++){
   g.renderer.draw(g.race,0,{driver:D.DRIVERS[0]});
   g.race.state='racing';let n=0;
   while(g.race.state==='racing'&&n++<60*(g.track.length*3/180+40))g.race.update(1/60,g.race.ai.inputFor(g.race.player,g.track));
   check(g.race.state==='finished','Grand Prix round '+(round+1)+' finishes with actual physics');
   g.showResult();check(!doc.getElementById('kart-result').hidden,'result dialog '+(round+1));
   check(doc.getElementById('result-laps').children.length===3,'three lap splits in result '+(round+1));
   const pointsBefore=JSON.stringify(g.cup.points);g.showResult();check(JSON.stringify(g.cup.points)===pointsBefore,'result cannot award duplicate cup points');
   check(g.cup.points[g.selectedDriver]>0,'cup points recorded');
   if(round<D.TRACKS.length-1){doc.getElementById('kart-next').click();g.audio.enabled=false;check(g.track===D.TRACKS[round+1],'next track loads');}
  }
  check(doc.getElementById('kart-next').hidden,'final cup has no next-track button');
  check(doc.getElementById('result-kicker').textContent.includes('SAMLET'),'overall cup standings shown');
  if(scenario==='result'){out.hidden=true;g.renderer.draw(g.race,.016,{driver:D.DRIVERS[0]});return;}
  const total=Object.values(g.cup.points).reduce((a,b)=>a+b,0);check(total===D.CUP_POINTS.reduce((sum,n)=>sum+n,0)*D.TRACKS.length,'one set of cup points per track');
  doc.getElementById('kart-retry').click();check(g.cup.round===0&&Object.values(g.cup.points).every(x=>x===0),'cup retry resets points');
  g.showMenu();g.mode='time';g.startRace();g.audio.enabled=false;check(g.race.karts.length===1&&g.race.itemBoxes.length===0,'time trial mode');
  g.togglePause(true);g.showMenu();g.renderer.draw(g.race,.016,{driver:D.DRIVERS[0]});
  check(g.renderer.renderer.info.render.calls<300,'menu draw-call budget');
  const memory={...g.renderer.renderer.info.memory};g.showMenu();g.renderer.draw(g.race,.016,{driver:D.DRIVERS[0]});
  check(g.renderer.renderer.info.memory.geometries<=memory.geometries+3&&g.renderer.renderer.info.memory.textures<=memory.textures+3,'rebuilding scenery releases previous GPU resources');
  check(errors.length===0,'no runtime errors');
  out.textContent='PASS · '+checks.length+' integration checks · '+g.renderer.renderer.info.render.calls+' menu draw calls\n'+checks.join('\n');out.dataset.status='passed';
 }catch(e){out.textContent='FAIL '+e.stack+'\n'+checks.join('\n');out.dataset.status='failed';}
}
frame.addEventListener('load',ready);
</script></html>
